name: Deploy public demo

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "submission/**"
      - "contracts/deployments/arc-testnet.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build -- --base=/Probability/
        working-directory: web
      - name: Add public judge assets
        run: |
          cp submission/Probability-Arc-Demo.mp4 web/dist/Probability-Arc-Demo.mp4
          cp submission/Probability-Arc-Pitch.pptx web/dist/Probability-Arc-Pitch.pptx
          cp submission/Probability-Arc-Pitch-preview.webp web/dist/Probability-Arc-Pitch-preview.webp
          cp contracts/deployments/arc-testnet.json web/dist/arc-testnet.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
